<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detail Payments Report</title>
  <style>
    * {
      box-sizing: border-box;
    }
    
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, Helvetica, sans-serif;
      background: #f2f2f2;
      color: #222;
    }
    
    .app {
      max-width: 1200px;
      margin: auto;
    }

    /* ========================= HEADER ========================= */
    .header {
      background: white;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .08);
    }

    .company h1 {
      margin: 0;
      font-size: 20px;
    }

    .company p {
      margin: 4px 0 0;
      font-size: 13px;
      color: #777;
    }

    .profile-box {
      text-align: right;
    }

    .profile-name {
      font-weight: bold;
      margin-bottom: 6px;
    }

    .profile-btn {
      border: 0;
      background: #333;
      color: white;
      padding: 8px 14px;
      border-radius: 7px;
      cursor: pointer;
    }

    /* ========================= CONTROL ========================= */
    .control-card {
      background: white;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 15px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: flex-end;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .08);
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .field label {
      font-size: 12px;
      font-weight: bold;
    }

    .field select,
    .field input {
      height: 38px;
      padding: 0 10px;
      border: 1px solid #bbb;
      border-radius: 6px;
      background: white;
    }

    .btn {
      height: 38px;
      padding: 0 15px;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-add {
      background: #00b894;
      color: white;
    }

    .btn-refresh {
      background: #444;
      color: white;
    }

    .btn-print {
      background: #f1c40f;
      color: #222;
    }

    /* ========================= REPORT ========================= */
    .report-card {
      background: white;
      border-radius: 12px;
      padding: 15px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .08);
    }

    .report-title {
      text-align: center;
      font-size: 22px;
      font-weight: bold;
      text-decoration: underline;
      margin-bottom: 15px;
    }

    .identity {
      width: 330px;
      border-collapse: collapse;
      margin-bottom: 25px;
    }

    .identity td {
      border: 1px solid #222;
      padding: 4px 8px;
      font-size: 13px;
      vertical-align: middle !important;
    }

    .identity td:first-child {
      width: 90px;
      font-weight: bold;
    }

    /* ========================= TABLE ========================= */
    .table-wrapper {
      width: 100%;
      overflow-x: auto;
    }

    .report-table {
      width: 100%;
      min-width: 1050px;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .report-table th,
    .report-table td {
      border: 1px solid #333;
      padding: 6px 5px;
      font-size: 12px;
      line-height: 1.2;
      vertical-align: middle !important;
    }

    .report-table th {
      background: #ffff00;
      text-align: center;
      font-weight: bold;
    }

    .report-table td {
      text-align: center;
    }

    /* Warna selang-seling berdasarkan grup tanggal */
    .report-table tbody tr.row-even {
      background: #e1e1e1;
    }

    .report-table tbody tr.row-odd {
      background: #ffffff;
    }

    .money {
      text-align: right !important;
      white-space: nowrap;
      vertical-align: middle !important;
    }

    .text-left {
      text-align: center !important;
      vertical-align: middle !important;
    }

    .date-cell { width: 90px; }
    .day-cell { width: 80px; }
    .start-cell,
    .arrived-cell { width: 130px; }
    .park-cell { width: 170px; }
    .money-cell { width: 120px; }
    .action-cell { width: 80px; }

    .action-btn {
      border: 0;
      padding: 4px 7px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 11px;
      margin: 1px;
    }

    .edit-btn {
      background: #3498db;
      color: white;
    }

    .delete-btn {
      background: #e74c3c;
      color: white;
    }

    .total-row td {
      background: #00ffff !important;
      font-weight: bold;
      vertical-align: middle !important;
    }

    .total-label,
    .balance-label {
      text-align: left !important;
    }

    .balance-row td {
      background: #ffff00 !important;
      font-weight: bold;
      vertical-align: middle !important;
    }

    .empty {
      text-align: center;
      padding: 25px;
      color: #777;
    }

    /* ========================= SIGNATURE AREA ========================= */
    .signature-container {
      margin-top: 30px;
      display: flex;
      justify-content: flex-end;
      padding-right: 15px;
    }

    .signature-box {
      width: 220px;
      text-align: center;
      font-size: 13px;
    }

    .signature-date {
      margin-bottom: 65px;
    }

    .signature-line {
      border-bottom: 1px solid #000;
      margin-bottom: 5px;
    }

    .signature-name {
      font-weight: bold;
    }

    /* ========================= MODAL ========================= */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .55);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 15px;
    }

    .modal.show {
      display: flex;
    }

    .modal-card {
      width: 100%;
      max-width: 550px;
      background: white;
      border-radius: 12px;
      padding: 20px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .modal-header h2 {
      margin: 0;
      font-size: 20px;
    }

    .close-btn {
      border: 0;
      background: #eee;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 18px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .form-group.full {
      grid-column: 1 / -1;
    }

    .form-group label {
      font-size: 12px;
      font-weight: bold;
    }

    .form-group input {
      width: 100%;
      height: 40px;
      border: 1px solid #bbb;
      border-radius: 6px;
      padding: 0 10px;
      font-size: 14px;
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 20px;
    }

    .btn-cancel {
      background: #ddd;
    }

    .btn-save {
      background: #00b894;
      color: white;
    }

    /* ========================= LOADING ========================= */
    .loading {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, .7);
      z-index: 10000;
    }

    .loading.show {
      display: flex;
    }

    .loading-box {
      background: white;
      padding: 20px 30px;
      border-radius: 10px;
      box-shadow: 0 3px 15px rgba(0, 0, 0, .2);
      font-weight: bold;
    }

    /* ========================= MOBILE ========================= */
    @media (max-width: 600px) {
      body {
        padding: 8px;
      }

      .header {
        flex-direction: column;
        align-items: flex-start;
      }

      .profile-box {
        text-align: left;
      }

      .control-card {
        align-items: stretch;
      }

      .field {
        width: 100%;
      }

      .field select,
      .field input,
      .btn {
        width: 100%;
      }

      .identity {
        width: 100%;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .form-group.full {
        grid-column: auto;
      }
    }

    /* ========================= PRINT / PDF A4 PORTRAIT ========================= */
    @media print {
      @page {
        size: A4 portrait;
        margin: 6mm;
      }

      html, body {
        width: 100%;
        margin: 0;
        padding: 0;
        background: white;
      }

      .app {
        width: 100%;
        max-width: none;
        margin: 0;
      }

      .header,
      .control-card,
      .modal,
      .loading {
        display: none !important;
      }

      .report-card {
        width: 100%;
        margin: 0;
        padding: 0;
        border: 0;
        box-shadow: none;
      }

      .report-title {
        font-size: 16px;
        margin: 0 0 8px;
        line-height: 1.2;
      }

      .identity {
        width: 48%;
        margin: 0 0 10px;
      }

      .identity td {
        font-size: 8.5px;
        padding: 3px 4px !important;
        line-height: 1.2;
        vertical-align: middle !important;
      }

      .table-wrapper {
        width: 100%;
        overflow: visible !important;
      }

      .report-table {
        width: 100% !important;
        min-width: 0 !important;
        max-width: none !important;
        table-layout: auto !important;
        border-collapse: collapse;
      }

      .action-cell,
      .report-table td:last-child {
        display: none !important;
      }

      .report-table th,
      .report-table td {
        font-size: 7.5px !important;
        line-height: 1.2 !important;
        padding: 4px 2px !important;
        height: auto !important;
        white-space: normal !important;
        word-break: normal !important;
        overflow-wrap: normal !important;
        vertical-align: middle !important;
      }

      .report-table th {
        font-size: 7.5px !important;
        white-space: normal !important;
        hyphens: none !important;
        vertical-align: middle !important;
      }

      .report-table .money {
        white-space: nowrap !important;
        font-size: 7px !important;
        vertical-align: middle !important;
      }

      .report-table .text-left {
        text-align: center !important;
        vertical-align: middle !important;
      }

      .total-row td,
      .balance-row td {
        font-size: 7.5px !important;
        white-space: nowrap !important;
        vertical-align: middle !important;
      }

      .total-row td:last-child,
      .balance-row td:last-child {
        display: none !important;
      }

      .signature-container {
        margin-top: 20px;
        padding-right: 0;
      }

      .signature-box {
        width: 180px;
        font-size: 8.5px;
      }

      .signature-date {
        margin-bottom: 45px;
      }
    }
  </style>
</head>
<body>

  <div class="app">
    <!-- HEADER -->
    <div class="header">
      <div class="company">
        <h1>PT JASA MANDIRI TECHGRAHA</h1>
        <p>Continuous Improvement!</p>
      </div>
      <div class="profile-box">
        <div id="profileNameDisplay" class="profile-name">-</div>
        <button class="profile-btn" onclick="openProfileModal()">Profile</button>
      </div>
    </div>

    <!-- CONTROL -->
    <div class="control-card">
      <div class="field">
        <label for="monthSelect">Month</label>
        <select id="monthSelect">
          <option value="">Month</option>
          <option>Januari</option>
          <option>Februari</option>
          <option>Maret</option>
          <option>April</option>
          <option>Mei</option>
          <option>Juni</option>
          <option>Juli</option>
          <option>Agustus</option>
          <option>September</option>
          <option>Oktober</option>
          <option>November</option>
          <option>Desember</option>
        </select>
      </div>
      
      <div class="field">
        <label for="yearSelect">Year</label>
        <select id="yearSelect">
          <option value="">Year</option>
          <option>2025</option>
          <option>2026</option>
          <option>2027</option>
          <option>2028</option>
          <option>2029</option>
          <option>2030</option>
          <option>2031</option>
          <option>2032</option>
          <option>2033</option>
          <option>2034</option>
          <option>2035</option>
          <option>2036</option>
        </select>
      </div>

      <button class="btn btn-refresh" onclick="loadData()">Refresh</button>
      <button class="btn btn-add" onclick="openPaymentModal()">+ Input Payment</button>
      <button class="btn btn-print" onclick="triggerPrint()">Print / PDF</button>
    </div>

    <!-- REPORT -->
    <div class="report-card">
      <div class="report-title">DETAIL PAYMENTS REPORT</div>

      <!-- IDENTITY -->
      <table class="identity">
        <tr>
          <td>Plat No.</td>
          <td id="reportPlat">-</td>
        </tr>
        <tr>
          <td>Driver</td>
          <td id="reportDriver">-</td>
        </tr>
        <tr>
          <td>Periode</td>
          <td id="reportPeriod">-</td>
        </tr>
      </table>

      <!-- REPORT TABLE -->
      <div class="table-wrapper">
        <table class="report-table">
          <thead>
            <tr>
              <th rowspan="2" class="date-cell">Date</th>
              <th rowspan="2" class="day-cell">Day</th>
              <th colspan="2">High Way</th>
              <th rowspan="2" class="park-cell">Park</th>
              <th rowspan="2" class="money-cell">Incoming Transfer</th>
              <th rowspan="2" class="money-cell">Patrol</th>
              <th rowspan="2" class="money-cell">Payment</th>
              <th rowspan="2" class="money-cell">Remain</th>
              <th rowspan="2" class="action-cell">Action</th>
            </tr>
            <tr>
              <th class="start-cell">Start</th>
              <th class="arrived-cell">Arrived</th>
            </tr>
          </thead>
          <tbody id="reportBody">
            <tr>
              <td colspan="10" class="empty">Pilih periode terlebih dahulu.</td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- SIGNATURE SECTION -->
      <div class="signature-container">
        <div class="signature-box">
          <div class="signature-date" id="signatureDateDisplay">Jakarta, -</div>
          <div class="signature-line"></div>
          <div class="signature-name" id="signatureNameDisplay">-</div>
        </div>
      </div>
    </div>
  </div>

  <!-- PAYMENT MODAL -->
  <div id="paymentModal" class="modal">
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="paymentModalTitle">Input Payment</h2>
        <button class="close-btn" onclick="closePaymentModal()">&times;</button>
      </div>
      <div class="form-grid">
        <div class="form-group">
          <label for="paymentDate">Date</label>
          <input type="date" id="paymentDate">
        </div>
        <div class="form-group">
          <label for="paymentDay">Day</label>
          <input type="text" id="paymentDay" readonly>
        </div>
        <div class="form-group">
          <label for="paymentStart">High Way - Start</label>
          <input type="text" id="paymentStart" placeholder="">
        </div>
        <div class="form-group">
          <label for="paymentArrived">High Way - Arrived</label>
          <input type="text" id="paymentArrived" placeholder="">
        </div>
        <div class="form-group full">
          <label for="paymentPark">Park</label>
          <input type="text" id="paymentPark" placeholder="">
        </div>
        <div class="form-group">
          <label for="paymentIncoming">Incoming Transfer</label>
          <input type="text" id="paymentIncoming" inputmode="numeric" placeholder="Rp0">
        </div>
        <div class="form-group">
          <label for="paymentPatrol">Patrol</label>
          <input type="text" id="paymentPatrol" inputmode="numeric" placeholder="Rp0">
        </div>
        <div class="form-group">
          <label for="paymentAmount">Payment</label>
          <input type="text" id="paymentAmount" inputmode="numeric" placeholder="Rp0">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-cancel" onclick="closePaymentModal()">Cancel</button>
        <button class="btn btn-save" onclick="savePayment()">Save</button>
      </div>
    </div>
  </div>

  <!-- PROFILE MODAL -->
  <div id="profileModal" class="modal">
    <div class="modal-card">
      <div class="modal-header">
        <h2>Profile</h2>
        <button class="close-btn" onclick="closeProfileModal()">&times;</button>
      </div>
      <div class="form-grid">
        <div class="form-group full">
          <label for="profileDriver">Driver</label>
          <input type="text" id="profileDriver" placeholder="">
        </div>
        <div class="form-group full">
          <label for="profilePlat">Plat No.</label>
          <input type="text" id="profilePlat" placeholder="">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-cancel" onclick="closeProfileModal()">Cancel</button>
        <button class="btn btn-save" onclick="saveProfile()">Save</button>
      </div>
    </div>
  </div>

  <!-- LOADING -->
  <div id="loading" class="loading">
    <div class="loading-box">Loading...</div>
  </div>

  <script>
    /* ========================= CONFIGURATION ========================= */
    const API_URL = "https://script.google.com/macros/s/AKfycbzLL8qFKEQm3Dup1pfFplQTwd0sjw38MO_5ju_O5qCFYaw7Gju8rqkkClATtUFenxVWNg/exec";
    let reportData = [];
    let editingId = null;

    const monthMap = {
      Januari: 1, Februari: 2, Maret: 3, April: 4, Mei: 5, Juni: 6,
      Juli: 7, Agustus: 8, September: 9, Oktober: 10, November: 11, Desember: 12
    };

    /* ========================= INITIALIZE ========================= */
    document.addEventListener("DOMContentLoaded", () => {
      loadProfile();
      setCurrentPeriod();
      bindCurrency();
      updateSignatureDate();
      document.getElementById("paymentDate").addEventListener("change", updateModalDay);
      loadData();
    });

    /* ========================= CURRENT PERIOD ========================= */
    function setCurrentPeriod() {
      const now = new Date();
      const month = now.getMonth() + 1;
      const year = now.getFullYear();
      const monthName = Object.keys(monthMap).find(key => monthMap[key] === month);
      
      document.getElementById("monthSelect").value = monthName || "";
      document.getElementById("yearSelect").value = year;
    }

    /* ========================= PERIOD ========================= */
    function getPeriod() {
      const month = document.getElementById("monthSelect").value;
      const year = document.getElementById("yearSelect").value;
      if (!month || !year) return "";
      return month + "-" + year;
    }

    /* ========================= LOAD DATA ========================= */
    async function loadData() {
      const period = getPeriod();
      if (!period) {
        renderTable([]);
        return;
      }

      showLoading("Mengambil data dari Spreadsheet...");
      try {
        const url = API_URL + "?action=list&period=" + encodeURIComponent(period);
        const response = await fetch(url);
        const result = await response.json();

        if (!result.success) {
          throw new Error(result.message || "Gagal mengambil data");
        }

        reportData = Array.isArray(result.data) ? result.data : [];
        reportData.sort((a, b) => String(a.date).localeCompare(String(b.date)));
        renderTable(reportData);
      } catch (error) {
        console.error(error);
        alert("Gagal mengambil data dari Spreadsheet.\n\n" + error.message);
      } finally {
        hideLoading();
      }
    }

    /* ========================= RENDER TABLE ========================= */
    function renderTable(data) {
      const tbody = document.getElementById("reportBody");
      tbody.innerHTML = "";
      updateIdentity();

      if (!data.length) {
        tbody.innerHTML = '<tr><td colspan="10" class="empty">Belum ada data untuk periode ini.</td></tr>';
        return;
      }

      let balance = 0;
      let totalIncoming = 0;
      let totalPatrol = 0;
      let totalPayment = 0;

      // Hitung berapa kali tiap tanggal muncul (untuk rowspan)
      const dateCounts = {};
      data.forEach(row => {
        dateCounts[row.date] = (dateCounts[row.date] || 0) + 1;
      });

      const dateRendered = {};
      let dateGroupIndex = 0; // Untuk mengontrol selang-seling warna grup tanggal
      let currentDateTrack = null;

      data.forEach((row) => {
        const incoming = numberValue(row.incomingTransfer);
        const patrol = numberValue(row.patrol);
        const payment = numberValue(row.payment);

        balance = balance + incoming - patrol - payment;
        totalIncoming += incoming;
        totalPatrol += patrol;
        totalPayment += payment;

        // Cek pergantian tanggal untuk menaikkan index grup warna
        if (currentDateTrack !== row.date) {
          currentDateTrack = row.date;
          dateGroupIndex++;
        }

        const tr = document.createElement("tr");
        // Berikan class warna berdasarkan grup tanggal (genap / ganjil)
        tr.className = (dateGroupIndex % 2 === 0) ? "row-even" : "row-odd";

        // Cek apakah tanggal ini sudah dirender sel Date & Day-nya
        if (!dateRendered[row.date]) {
          const rowSpan = dateCounts[row.date];
          dateRendered[row.date] = true;

          tr.innerHTML = `
            <td rowspan="${rowSpan}">${formatDate(row.date)}</td>
            <td rowspan="${rowSpan}">${getDayName(row.date)}</td>
            <td class="text-left">${escapeHtml(row.start || "")}</td>
            <td class="text-left">${escapeHtml(row.arrived || "")}</td>
            <td class="text-left">${escapeHtml(row.park || "")}</td>
            <td class="money">${formatRupiah(incoming)}</td>
            <td class="money">${formatRupiah(patrol)}</td>
            <td class="money">${formatRupiah(payment)}</td>
            <td class="money">${formatRupiah(balance, false)}</td>
            <td class="action-cell">
              <button class="action-btn edit-btn" onclick="editPayment('${row.id}')">Edit</button>
              <button class="action-btn delete-btn" onclick="deletePayment('${row.id}')">Delete</button>
            </td>
          `;
        } else {
          // Baris gabungan (tanpa elemen Date & Day)
          tr.innerHTML = `
            <td class="text-left">${escapeHtml(row.start || "")}</td>
            <td class="text-left">${escapeHtml(row.arrived || "")}</td>
            <td class="text-left">${escapeHtml(row.park || "")}</td>
            <td class="money">${formatRupiah(incoming)}</td>
            <td class="money">${formatRupiah(patrol)}</td>
            <td class="money">${formatRupiah(payment)}</td>
            <td class="money">${formatRupiah(balance, false)}</td>
            <td class="action-cell">
              <button class="action-btn edit-btn" onclick="editPayment('${row.id}')">Edit</button>
              <button class="action-btn delete-btn" onclick="deletePayment('${row.id}')">Delete</button>
            </td>
          `;
        }

        tbody.appendChild(tr);
      });

      /* TOTAL ROW */
      const totalTr = document.createElement("tr");
      totalTr.className = "total-row";
      totalTr.innerHTML = `
        <td colspan="5" class="total-label">Total</td>
        <td class="money">${formatRupiah(totalIncoming)}</td>
        <td class="money">${formatRupiah(totalPatrol)}</td>
        <td class="money">${formatRupiah(totalPayment)}</td>
        <td></td>
        <td></td>
      `;
      tbody.appendChild(totalTr);

      /* BALANCE ROW */
      const balanceTr = document.createElement("tr");
      balanceTr.className = "balance-row";
      balanceTr.innerHTML = `
        <td colspan="8" class="balance-label">Balance</td>
        <td class="money">${formatRupiah(balance, false)}</td>
        <td></td>
      `;
      tbody.appendChild(balanceTr);
    }

    /* ========================= PAYMENT MODAL ========================= */
    function openPaymentModal(id = null) {
      editingId = id;
      clearPaymentForm();

      if (id) {
        const row = reportData.find(item => String(item.id) === String(id));
        if (!row) {
          alert("Data tidak ditemukan.");
          return;
        }

        document.getElementById("paymentModalTitle").textContent = "Edit Payment";
        document.getElementById("paymentDate").value = row.date || "";
        document.getElementById("paymentStart").value = row.start || "";
        document.getElementById("paymentArrived").value = row.arrived || "";
        document.getElementById("paymentPark").value = row.park || "";
        document.getElementById("paymentIncoming").value = formatRupiah(numberValue(row.incomingTransfer));
        document.getElementById("paymentPatrol").value = formatRupiah(numberValue(row.patrol));
        document.getElementById("paymentAmount").value = formatRupiah(numberValue(row.payment));
        updateModalDay();
      } else {
        document.getElementById("paymentModalTitle").textContent = "Input Payment";
      }

      document.getElementById("paymentModal").classList.add("show");
    }

    function closePaymentModal() {
      document.getElementById("paymentModal").classList.remove("show");
      editingId = null;
    }

    function clearPaymentForm() {
      [
        "paymentDate", "paymentDay", "paymentStart", "paymentArrived",
        "paymentPark", "paymentIncoming", "paymentPatrol", "paymentAmount"
      ].forEach(id => document.getElementById(id).value = "");
    }

    function updateModalDay() {
      const date = document.getElementById("paymentDate").value;
      document.getElementById("paymentDay").value = date ? getDayName(date) : "";
    }

    /* ========================= SAVE PAYMENT ========================= */
    async function savePayment() {
      const period = getPeriod();
      if (!period) {
        alert("Pilih Month dan Year terlebih dahulu.");
        return;
      }

      const date = document.getElementById("paymentDate").value;
      if (!date) {
        alert("Tanggal harus diisi.");
        return;
      }

      const data = {
        id: editingId || generateId(),
        period: period,
        date: date,
        start: document.getElementById("paymentStart").value.trim(),
        arrived: document.getElementById("paymentArrived").value.trim(),
        park: document.getElementById("paymentPark").value.trim(),
        incomingTransfer: parseRupiah(document.getElementById("paymentIncoming").value),
        patrol: parseRupiah(document.getElementById("paymentPatrol").value),
        payment: parseRupiah(document.getElementById("paymentAmount").value)
      };

      if (!data.start && !data.arrived && !data.park && data.incomingTransfer === 0 && data.patrol === 0 && data.payment === 0) {
        alert("Masukkan minimal satu data.");
        return;
      }

      if (!confirm("Data sudah benar?")) {
        return;
      }

      showLoading("Menyimpan data...");
      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            action: editingId ? "update" : "add",
            data: data
          })
        });

        const result = await response.json();
        if (!result.success) {
          throw new Error(result.message || "Gagal menyimpan");
        }

        closePaymentModal();
        await loadData();
        alert(editingId ? "Data berhasil diperbarui." : "Data berhasil disimpan.");
      } catch (error) {
        console.error(error);
        alert("Gagal menyimpan data.\n\n" + error.message);
      } finally {
        hideLoading();
      }
    }

    /* ========================= EDIT & DELETE ========================= */
    function editPayment(id) {
      openPaymentModal(id);
    }

    async function deletePayment(id) {
      const row = reportData.find(item => String(item.id) === String(id));
      if (!row) return;

      if (!confirm("Hapus data tanggal " + formatDate(row.date) + "?")) {
        return;
      }

      showLoading("Menghapus data...");
      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            action: "delete",
            data: { id: id }
          })
        });

        const result = await response.json();
        if (!result.success) {
          throw new Error(result.message || "Gagal menghapus");
        }

        await loadData();
        alert("Data berhasil dihapus.");
      } catch (error) {
        console.error(error);
        alert("Gagal menghapus data.\n\n" + error.message);
      } finally {
        hideLoading();
      }
    }

    /* ========================= PROFILE ========================= */
    function openProfileModal() {
      document.getElementById("profileDriver").value = localStorage.getItem("employeeName") || "";
      document.getElementById("profilePlat").value = localStorage.getItem("employeeLocation") || "";
      document.getElementById("profileModal").classList.add("show");
    }

    function closeProfileModal() {
      document.getElementById("profileModal").classList.remove("show");
    }

    function saveProfile() {
      const driver = document.getElementById("profileDriver").value.trim();
      const plat = document.getElementById("profilePlat").value.trim();

      localStorage.setItem("employeeName", driver);
      localStorage.setItem("employeeLocation", plat);

      updateIdentity();
      closeProfileModal();
    }

    function loadProfile() {
      updateIdentity();
    }

    function updateIdentity() {
      const driver = localStorage.getItem("employeeName") || "-";
      const plat = localStorage.getItem("employeeLocation") || "-";
      const period = getPeriod() || "-";

      document.getElementById("profileNameDisplay").textContent = driver;
      document.getElementById("reportDriver").textContent = driver;
      document.getElementById("reportPlat").textContent = plat;
      document.getElementById("reportPeriod").textContent = period;
      document.getElementById("signatureNameDisplay").textContent = driver;
    }

    /* ========================= PRINT & SIGNATURE DATE ========================= */
    function updateSignatureDate() {
      const today = new Date();
      const options = { day: 'numeric', month: 'long', year: 'numeric' };
      const formattedDate = today.toLocaleDateString('id-ID', options);
      document.getElementById("signatureDateDisplay").textContent = `Jakarta, ${formattedDate}`;
    }

    function triggerPrint() {
      updateSignatureDate();
      window.print();
    }

    /* ========================= CURRENCY ========================= */
    function bindCurrency() {
      ["paymentIncoming", "paymentPatrol", "paymentAmount"].forEach(id => {
        const input = document.getElementById(id);
        input.addEventListener("input", function() {
          const value = parseRupiah(this.value);
          this.value = value ? formatRupiah(value) : "";
        });
      });
    }

    function parseRupiah(value) {
      if (value === null || value === undefined) return 0;
      return Number(String(value).replace(/[^\d]/g, "")) || 0;
    }

    function formatRupiah(value, allowEmptyIfZero = true) {
      value = Number(value) || 0;
      if (value === 0 && allowEmptyIfZero) return "";
      return "Rp" + value.toLocaleString("id-ID");
    }

    function numberValue(value) {
      if (value === null || value === undefined || value === "") return 0;
      if (typeof value === "number") return value;
      return parseRupiah(value);
    }

    /* ========================= DATE & UTILITY ========================= */
    function formatDate(value) {
      if (!value) return "";
      const parts = String(value).split("-");
      if (parts.length !== 3) return value;
      return parts[2] + "/" + parts[1] + "/" + parts[0];
    }

    function getDayName(value) {
      if (!value) return "";
      const date = new Date(value + "T00:00:00");
      return date.toLocaleDateString("en-US", { weekday: "long" });
    }

    function generateId() {
      return Date.now().toString() + Math.random().toString(36).substring(2, 8);
    }

    function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    /* ========================= LOADING ========================= */
    function showLoading(text) {
      document.querySelector(".loading-box").textContent = text || "Loading...";
      document.getElementById("loading").classList.add("show");
    }

    function hideLoading() {
      document.getElementById("loading").classList.remove("show");
    }

    /* ========================= EVENT LISTENERS ========================= */
    document.getElementById("monthSelect").addEventListener("change", loadData);
    document.getElementById("yearSelect").addEventListener("change", loadData);

    document.getElementById("paymentModal").addEventListener("click", function(e) {
      if (e.target === this) closePaymentModal();
    });

    document.getElementById("profileModal").addEventListener("click", function(e) {
      if (e.target === this) closeProfileModal();
    });
  </script>
</body>
</html>
